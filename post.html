---
layout: default
---
<article class="post-single">
  <div class="post-header">
    {% if page.tags %}
    <div class="tag-list">
      {% for tag in page.tags %}<span class="tag-pill">{{ tag }}</span>{% endfor %}
    </div>
    {% endif %}
    <h1 class="post-title">{{ page.title }}</h1>
    <div class="post-meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y년 %m월 %d일" }}</time>
      {% if page.github %}<a class="ext-link" href="{{ page.github }}" target="_blank" rel="noopener">GitHub &#8599;</a>{% endif %}
      {% if page.demo %}<a class="ext-link" href="{{ page.demo }}" target="_blank" rel="noopener">데모 보기 &#8599;</a>{% endif %}
    </div>
  </div>

  <div class="post-body">
    {{ content }}
  </div>

  <div class="post-nav">
    <a href="{{ '/' | relative_url }}">&larr; 전체 글 목록</a>
  </div>
</article>
