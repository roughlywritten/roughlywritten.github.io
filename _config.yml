# ============================================
# 아래 값들을 본인 정보로 바꿔주세요
# ============================================
title: "기록소"                 # 블로그 이름
description: "직접 써보고 느낀 대로 남기는 제품 리뷰 기록"   # 블로그 한 줄 소개 (검색결과에 노출됨)
url: "https://YOUR-GITHUB-USERNAME.github.io"   # 예: https://hong123.github.io
baseurl: ""                     # 저장소 이름을 그대로 쓸 경우 "/저장소이름" 으로 변경 (아래 README 참고)
lang: ko
author: "익명"
timezone: Asia/Seoul

# ============================================
# 아래부터는 건드리지 않아도 됩니다
# ============================================
markdown: kramdown
permalink: /:categories/:title/

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - node_modules
