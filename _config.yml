# ============================================
# 아래 값들을 본인 정보로 바꿔주세요
# ============================================
title: "박지은 | Actuary & Data"        # 본인 이름/타이틀로 변경 (예: "김철수 | Actuary & Data")
description: "보험계리 실무에 Python, Excel, Prophet, AI를 적용한 프로젝트 기록"  # 검색결과에 노출됨
url: "https://roughlywritten.github.io"   # 예: https://hong123.github.io
baseurl: ""                     # 저장소 이름을 그대로 쓸 경우 "/저장소이름" 으로 변경 (아래 README 참고)
lang: ko
author: "박지은"                   # 실명 권장 (검색/채용담당자 노출에 유리)
timezone: Asia/Seoul

# ============================================
# 아래부터는 건드리지 않아도 됩니다
# ============================================
markdown: kramdown
highlighter: rouge
kramdown:
  syntax_highlighter: rouge
permalink: /:categories/:title/

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - node_modules
